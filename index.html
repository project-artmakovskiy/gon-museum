ы", "К. У. Черненко"], ["1931–2007 годы", "Б. Н. Ельцин"]], "e": ""}, {"t": "match", "q": "Расставьте правильно руководителей государства и годы их нахождения в статусе первых лиц страны.", "pairs": [["1894–1917 годы", "Николай II"], ["1917–1924 годы", "В. И. Ленин"], ["1953–1964 годы", "Н. С. Хрущев"], ["1984–1985 годы", "К. У. Черненко"]], "e": ""}, {"t": "match", "q": "Расставьте правильно лидеров и годы их жизни.", "pairs": [["1906–1982 годы", "Л. И. Брежнев"], ["1914–1984 годы", "Ю. В. Андропов"], ["1911–1985 годы", "К. У. Черненко"], ["1931–2007 годы", "Б. Н. Ельцин"]], "e": ""}, {"t": "match", "q": "Расставьте правильно названия российских городов и их прежние названия в честь первых лиц Советского государства.", "pairs": [["Ленинград", "Санкт-Петербург"], ["Брежнев", "Набережные Челны"], ["Андропов", "Рыбинск"], ["Черненко", "Шарыпово"]], "e": ""}, {"t": "match", "q": "Выберите и расположите правильно подписи к фотографиям.", "pairs": [["gon-24.webp", "Б. Н. Ельцин и В. В. Путин"], ["gon-25.webp", "Д. А. Медведев и В. В. Путин"]], "limg": true, "extra": ["М. С. Горбачев и В. В. Путин", "С. С. Собянин и В. В. Путин"], "e": ""}, {"t": "match", "q": "Выберите и расположите правильно подписи к фотографиям.", "pairs": [["gon-27.webp", "Н. С. Хрущев и Л. И. Брежнев"], ["gon-23.webp", "В. И. Ленин и И. В. Сталин"]], "limg": true, "extra": ["Л. И. Брежнев и М. С. Горбачев", "В. И. Ленин и Л. И. Брежнев"], "e": ""}]}, "avto": {"title": "Отечественный автопром", "qs": [{"q": "Как расшифровывается сокращенное название одного из старейших автомобильных заводов страны — ЗИЛ?", "o": ["Завод имени В. И. Ленина", "Завод имени И. А. Лихачёва", "Завод инновационных лазерных технологий", "Завод имени Ленинского комсомола"], "a": 1, "e": "В августе 1916 года Торговый дом «Кузнецов, Рябушинские и Ко» начал строительство автомобильного завода в Москве, на котором планировалось выпускать по лицензии грузовики FIAT 15 Ter. Однако до Октябрьской революции 1917 года удалось организовать только сборку автомобилей из итальянских деталей. В 1924 году на заводе было начато производство грузовиков АМО-Ф-15. В 1927 году директором завода был назначен И. А. Лихачёв. В 1930 году была приобретена лицензия на американский грузовик AutoСar и начат выпуск автомобилей АМО-2 и АМО-3. В 1931-м предприятие переименовано в Завод имени И. В. Сталина — ЗИС. В 1933 году начат выпуск автомобиля ЗИС-5. С этого времени были спроектированы и выпущены десятки грузовых автомобилей. Выпуском грузовиков предприятие не ограничилось: здесь производились военные машины, автобусы, велосипеды и даже холодильники. Разработки завода, который с 1956 года стал носить имя И. А. Лихачёва, были положены в основу проекта грузового автомобиля КАМАЗ. С 1936 года завод выпускал легковые автомобили представительского класса. До середины 1990-х годов первые лица нашего государства передвигались на автомобилях этого завода. Первой такой машиной стал ЗИС-101. За многие десятилетия с конвейера завода сошли: 12 тысяч легковых автомобилей, более 7 млн грузовых автомобилей, более 39 тысяч автобусов, спецтехника и даже гоночные автомобили. Продукция завода поставлялась на экспорт в 51 страну."}, {"q": "Именем какой реки, расположенной в России, назвали новый легковой автомобиль М-21 (с 1965 года — ГАЗ-21), серийное производство которого началось в 1956 году?", "o": ["Енисей", "Лена", "Ангара", "Волга"], "a": 3, "e": "ГАЗ-21 «Волга» — советский легковой автомобиль с кузовом седан. До 1965 года назывался ГАЗ М-21 «Волга». Выпускался серийно с 1956 года (до 1958 года параллельно с ГАЗ М-20 «Победа») по 1970 год."}, {"q": "Под каким названием экспортировался советский легковой автомобиль «Жигули»?", "o": ["«Лада»", "«Самара»", "«Спутник»", "«Нива»"], "a": 0, "e": "Название «Жигули» было сложным в произношении для потенциальных иностранных покупателей, поэтому в 1973 году появилось название «Лада» (LADA)."}, {"q": "Как называется автомобиль ГАЗ-13?", "o": ["«Чайка»", "«Беркут»", "«Голубь»", "«Соловей»"], "a": 0, "e": "«Чайка» — название моделей ГАЗ. Это легковые автомобили советского представительского класса, которые выпускались с 1959 по 1988 год."}, {"q": "Какой модификации у правительственного автомобиля ЗИЛ-111 не было?", "o": ["ЗИЛ-111А", "ЗИЛ-111В", "ЗИЛ-111Д", "ЗИЛ-111У"], "a": 3, "e": "В 1959 году в серию пошла модификация ЗИЛ-111А, оборудованная советской установкой кондиционирования воздуха. В 1960 году началось изготовление фаэтона ЗИЛ-111В. ЗИЛ-111Д — модификация правительственного автомобиля с кузовом кабриолет."}, {"q": "Как народная молва ласково называла легковой автомобиль ВАЗ-2101?", "o": ["«Единичка»", "«Копейка»", "«Гвоздик»", "«Конёк»"], "a": 1, "e": "19 апреля 1970 года — день рождения «Копейки»: с главного конвейера автозавода сошли первые шесть пилотных автомобилей ВАЗ-2101 — два синих и четыре вишневых."}, {"q": "Какой автомобиль угнал Юрий Деточкин в фильме «Берегись автомобиля» из гаража продавца комиссионного магазина Димы Семицветова?", "o": ["М-20 «Победа»", "ГАЗ-21 «Волга»", "ЗАЗ-965 «Запорожец»", "«Москвич-408»"], "a": 1, "e": "ГАЗ-21 «Волга» — советский автомобиль среднего класса, серийно производившийся на Горьковском автомобильном заводе с 1956 по 1970 год."}, {"q": "Как правильно называется семейство российских автомобилей представительского и высшего класса проекта ЕМП?", "o": ["«Акропус»", "«Аурус»", "«Авторус»", "«Окрорус»"], "a": 1, "e": "Бренд Aurus/«Аурус» относится к автомобилям представительского и высшего класса. Миссия бренда Aurus/«Аурус»: «Создавать уникальные автомобили в сегменте люкс, которые могут справиться с любыми вызовами». В название бренда входят несколько смыслов: АУРА человека, AURUM — «золото» (лат.) и RUS — Всемирный знак России. Разработчики бренда — инженеры российского института НАМИ."}, {"q": "Выберите правильное название семейства российских автомобилей II группы малого класса, выпускавшихся с 2004 по 2018 год на АвтоВАЗе:", "o": ["«Лада Малина»", "«Лада Рябина»", "«Лада Калина»", "«Лада Ирга»"]  const q=st.pool[st.i];let sel=null,links={};
 const draw=()=>{
  app.innerHTML=`<div class="card">${head()}<p class="tip">Нажмите пункт слева, затем подходящий вариант справа</p>
   <div class="mt">
    <div class="col"><span class="hd">Пункты</span>${q.L.map((x,j)=>{const l=links[j];
      const cell=q.limg?`<img class="mimg" src="${IMGSRC(x)}" alt="">`:esc(x);
      return `<button class="mi${q.limg?' pic':''}${l!=null?' done':''}${sel===j?' sel':''}" data-l="${j}"><span class="tag2">${j+1}</span><span>${cell}${l!=null?' &rarr; '+String.fromCharCode(1040+l):''}</span></button>`}).join('')}</div>
    <div class="col"><span class="hd">Варианты</span>${q.R.map((x,j)=>{const used=Object.values(links).includes(j);
      return `<button class="mi${used?' used':''}" data-r="${j}"><span class="tag2">${String.fromCharCode(1040+j)}</span><span>${esc(x)}</span></button>`}).join('')}</div>
   </div>
   <div class="go"><button class="btn" id="ok" ${Object.keys(links).length<q.L.length?'disabled':''}>Ответить</button></div></div>`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const j=+b.dataset.l;
    if(links[j]!=null){delete links[j];sel=null}else sel=(sel===j?null:j);draw()});
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(sel==null)return;links[sel]=+b.dataset.r;sel=null;draw()});
  document.getElementById('ok').onclick=()=>next(q.L.every((_,j)=>q.R[links[j]]===q.map[j]));
 };draw();window.scrollTo(0,0);
}
function qPick(){
 const q=st.pool[st.i];
 app.innerHTML=`<div class="card">${head()}
  <div class="gal">${q.qi.map((im,j)=>`<div class="gi"><span class="gn">${j+1}</span><img src="${IMGSRC(im)}" alt=""></div>`).join('')}</div>
  <div class="opts">${q.o.map((o,j)=>`<button class="op" data-j="${j}"><span class="k">${String.fromCharCode(1040+j)}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`;
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>next(+b.dataset.j===q.a));
 window.scrollTo(0,0);
}
function quiz(){
 const q=st.pool[st.i];
 if(q.t==='pick')return qPick();
 if(q.t==='order')return qOrder();
 if(q.t==='match')return qMatch();
 const n=st.i+1, photo=q.oi&&q.oi.some(x=>x);
 app.innerHTML=`<div class="card">${head()}
  ${(q.qi||[]).map(i=>`<img class="qimg" src="${IMGSRC(i)}" alt="">`).join('')}
  <div class="opts${photo?' grid':''}">${q.o.map((o,j)=>{
    const im=q.oi&&q.oi[j]?`<img src="${IMGSRC(q.oi[j])}" alt="">`:'';
    return `<button class="op${im&&!o?' ph':''}" data-j="${j}">${im||`<span class="k">${String.fromCharCode(1040+j)}</span><span>${esc(o)}</span>`}</button>`}).join('')}</div></div>`;
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{st.pick=+b.dataset.j;next(+b.dataset.j===q.a)});
 window.scrollTo(0,0);
}
function result(){
 const right=st.ans.filter(Boolean).length, perfect=right===st.pool.length;
 app.innerHTML=`<div class="card">
  <span class="tag">Результат</span>
  <div class="score">${right}<em>/${st.pool.length}</em></div>
  <div class="coupon${perfect?' perfect':''}">
    <div class="ttl">${perfect?'Идеальный результат!':'Почти получилось!'}</div>
    <p>${perfect?'Вы ответили верно на все вопросы. Поделитесь своим достижением с друзьями.':
      right+' из '+st.pool.length+' — это уже неплохо. Попробуйте ещё раз, чтобы улучшить результат. Подпишитесь на соцсети музея: там столько интересного, что в следующий раз получится ответить на все вопросы.'}</p>
    <div class="acts">${perfect?'<button class="btn w" id="sh">Поделиться</button>':''}
      <a class="btn ${perfect?'gw':'w'}" href="${SOCIAL}" target="_blank" rel="noopener">Соцсети музея</a></div>
  </div>
  <div style="margin-top:38px"><span class="tag">Разбор ответов</span></div>
  <div class="rev">${st.pool.map((q,i)=>{const ok=st.ans[i];return `<div class="ri">
    <button class="rh"><span class="mk ${ok?'ok':'no'}">${ok?'\u2713':'\u2715'}</span><span class="rq">${esc(q.q)}</span><span class="chev">\u25be</span></button>
    <div class="rb">${(q.qi||[]).map(x=>`<img src="${IMGSRC(x)}" alt="">`).join('')}
      <div class="row"><span class="lb">Правильный ответ</span><span class="val">${
        q.t==='order'?esc(q.seq.join(' → ')):
        q.t==='match'?q.L.map((x,j)=>(q.limg?'Фото '+(j+1):esc(x))+' — '+esc(q.map[j])).join('<br>'):
        (esc(q.o[q.a])||'(фото)')}</span></div>
      ${q.e?`<div class="row"><span class="lb">Пояснение</span>${esc(q.e)}</div>`:''}</div></div>`}).join('')}</div>
  <div class="nav"><button class="btn" id="ag">Пройти ещё раз</button><button class="btn gh" id="hm">Выбрать тему</button></div></div>`;
 app.querySelectorAll('.rh').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
 document.getElementById('ag').onclick=()=>start(st.k);
 document.getElementById('hm').onclick=home;
 const sh=document.getElementById('sh');
 if(sh)sh.onclick=async()=>{
  const text=`${right} из ${st.pool.length} в викторине Музея Гаража особого назначения — тема «${T[st.k].title}». Проверь себя:`;
  try{
   if(navigator.share){await navigator.share({title:'Викторина Музея ГОН',text,url:QUIZURL});return}
   await navigator.clipboard.writeText(text+' '+QUIZURL);
   sh.textContent='Ссылка скопирована';setTimeout(()=>sh.textContent='Поделиться',2200);
  }catch(e){}
 };
 window.scrollTo(0,0);
}
home();
</script>

<script>
(function(){
  var last=0, box=document.getElementById('gon');
  function h(){ return Math.ceil(box.getBoundingClientRect().height); }
  function send(){ var v=h(); if(v && v!==last){ last=v; parent.postMessage({gonQuizHeight:v},'*'); } }
  var t; function ping(){ clearTimeout(t); t=setTimeout(send,50); }
  if(document.readyState==='complete') send(); else window.addEventListener('load',send);
  window.addEventListener('resize',ping);
  document.addEventListener('click',function(){ ping(); setTimeout(send,350); });
  new ResizeObserver(ping).observe(box);
})();
</script>
</body></html>
