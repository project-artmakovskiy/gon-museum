const IMGSRC=k=>(URLS[k]||'');
const DATA={"topics": {"kreml": {"title": "Московский Кремль", "qs": [{"q": "На каком холме расположен Московский Кремль?", "o": ["на Боровицком холме", "на Ивановском холме", "на Красном холме", "Московский Кремль не расположен на холме"], "a": 0, "e": "Московский Кремль расположен на Боровицком холме. Другие названия — Боровицкий мыс, Кремлевский холм. Высота — до 145 м над уровнем моря."}, {"q": "На берегу какой реки стоит Московский Кремль?", "o": ["Яузы", "Волги", "Москвы", "Енисея"], "a": 2, "e": "Московский Кремль расположен на левом берегу Москвы-реки, при впадении в нее речки Неглинной."}, {"q": "Кто из князей в 1156 году приказал начать строительство первого московского деревянного Кремля?", "o": ["Андрей Боголюбский", "Юрий Долгорукий", "Святослав Ольгович", "Игорь Святославович"], "a": 1, "e": "С именем князя Юрия Долгорукого связано первое упоминание о Москве в летописи в 1147 году. В 1156 году Юрий Долгорукий приказал заложить здесь град-крепость."}, {"q": "Из какого материала были построены первые крепостные стены Московского Кремля?", "o": ["из дерева", "из кирпича", "из камня", "из глины"], "a": 0, "e": "Первые стены Московского Кремля были построены из дерева в 1156 году по приказу князя Юрия Долгорукого. Эти данные сохранились в древних летописях."}, {"q": "В каком веке были сооружены стены Московского Кремля из белого камня?", "o": ["в XIII веке", "в XIV веке", "в XV веке", "в XVI веке"], "a": 1, "e": "В 1365 году Кремль жестоко пострадал от очередного пожара. Молодой князь Дмитрий Иванович принял решение возвести каменные укрепления на Боровицком холме. Всю зиму 1367 года из села Мячково, что находилось в 30 верстах от Москвы, возили на санях известняк, а весной начались строительные работы. В результате в центре Москвы поднялись стены и башни, ставшие первой белокаменной крепостью Северо-Восточной Руси. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Назовите самую известную башню Московского Кремля, которую всегда показывают по телевизору в новогоднюю ночь?", "o": ["Боровицкая башня", "Оружейная башня", "Спасская башня", "Водовзводная башня"], "a": 2, "e": "Спасская башня возведена в 1491 году архитектором Пьетро Антонио Солари. Ее ворота, выходящие на Красную площадь, всегда были главным парадным въездом в Кремль. Первые часы на Спасской башне были установлены по проекту Христофора Галовея. Звезда на Спасской башне впервые была установлена в 1935 году, в 1937 году ее сменила новая, имеющая размах лучей 3,75 метра. Внутри звезды круглосуточно горит лампа мощностью 5000 вт. Звезда вращается от ветра, как флюгер. Спасская башня имеет 10 этажей. Высота башни вместе со звездой — 71 метр. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Чем украшена верхняя часть стен Кремля?", "o": ["зубцами в виде стрел", "зубцами в виде прямоугольника", "зубцами в виде ласточкиного хвоста", "зубцами в виде пик"], "a": 2, "e": "верх стен Московского Кремля украшен зубцами (мерлонами) в форме ласточкиного хвоста, выполненными по итальянской моде XV века. Всего по верху стены размещены 1044 зубца."}, {"q": "Какая площадь Московского Кремля является самой древней?", "o": ["Дворцовая площадь", "Троицкая площадь", "Соборная площадь", "Ивановская площадь"], "a": 2, "e": "В центре Кремля располагается главная и самая древняя площадь Кремля — Соборная. Она сохранила уникальный архитектурно-градостроительный ансамбль Средневековья. Основа планировочной структуры площади была заложена в первой половине XIV века, когда по указу великих князей московских Ивана Калиты, а затем Дмитрия Донского на верхнем плато Боровицкого холма были построены первые белокаменные храмы. Они не сохранились, но определили пространственную композицию будущей площади. В конце XV — начале XVI века, когда Москва стала столицей единого государства и великий князь московский Иван III строил достойную «государя всея Руси» резиденцию в Кремле, новые храмы были поставлены на местах своих предшественников. Сегодня в ансамбль Соборной площади входят: Успенский, Архангельский, Благовещенский соборы, Грановитая палата, Золотая Царицына палата и церкви Теремного дворца, церковь Ризположения, Патриаршие палаты с церковью Двенадцати апостолов, ансамбль колокольни «Иван Великий». (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "В старину это было самое высокое здание не только Московского Кремля, но и всей Москвы — 82 метра. Вид с ее башни открывался на 30–40 километров. О каком здании Московского Кремля идет речь?", "o": ["Успенский собор", "Грановитая палата", "Патриаршие палаты", "Колокольня «Иван Великий»"], "a": 3, "e": "Колокольня «Иван Великий» была построена в 1505–1508 годах. В конце XVI века Борис Годунов, мечтая построить в Кремле Вселенский храм по образу Иерусалимского, приказал увеличить размеры колокольни, надстроив ее высоким барабаном с золоченой главой. В результате высота столпа вместе с крестом достигла 82 м. На протяжении двух веков «Иван Великий» оставался самым высоким зданием на Руси. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Какое здание на территории Московского Кремля было построено для жилых покоев царя Михаила Федоровича?", "o": ["Теремной дворец", "Грановитая палата", "Потешный дворец", "Оружейная палата"], "a": 2, "e": "Потешный дворец расположен у западной Кремлевской стены, между Комендантской и Троицкой башнями. Здание было построено в 1651 году как жилые палаты боярина И. Д. Милославского — тестя царя Алексея Михайловича. Сейчас они являются единственным сохранившимся в Кремле образцом боярских хором. Узкий участок между крепостной стеной и хозяйственной застройкой царской резиденции определил планировочное решение усадьбы Милославского. В центре участка расположилось само строение, с юга и севера соответственно парадный и хозяйственный дворы. Почти квадратное в плане здание имело в середине арочный проход, соединявший обе территории. Парадное крыльцо, выходившее на южный двор, замыкало пристройку, поставленную глаголем к основному объему палат. По смерти И. Д. Милославского усадьба в 1669 году перешла в казну, после чего палаты соединили каменными переходами с царским дворцом. В 1672 году в них для царской семьи стали устраиваться потехи — первые на Руси театральные представления, в результате чего палаты стали именоваться Потешным дворцом. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Сколько башен у Московского Кремля?", "o": ["20 башен", "5 башен", "11 башен", "13 башен"], "a": 0, "e": "Московский Кремль включает 20 башен: Спасская башня, Царская башня, Набатная башня, Константино-Еленинская башня, Беклемишевская башня, Петровская башня, Вторая Безымянная башня, Первая Безымянная башня, Тайницкая, Благовещенская башня, Водовзводная башня, Боровицкая башня, Оружейная башня, Комендантская башня, Троицкая башня, Кутафья башня, Средняя Арсенальная башня, Угловая Арсенальная башня, Никольская башня, Сенатская башня."}, {"q": "В какой башне Московского Кремля была устроена подъемная машина, которая подавала воду по свинцовым трубам в сады Кремля?", "o": ["в Арсенальной", "в Водовзводной", "в Троицкой", "в Набатной"], "a": 1, "e": "Водовзводная башня была возведена в 1488 году архитектором Антоном Фрязиным и имела колодец и тайник для выхода к реке. В 1633 году Христофор Галовей устроил в башне подъемную машину, которая подавала воду по свинцовым трубам в сады нагорной части Кремля. Верх башни в 1937 году был увенчан рубиновой звездой. Высота башни до звезды — 57,7 метра, со звездой — 61,25 метра. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Какая башня получила свое название от располагавшейся неподалеку в Кремле церкви?", "o": ["Константино-Еленинская", "Оружейная башня", "Кутафья башня", "Водовзводная башня"], "a": 0, "e": "Константино-Еленинская башня возведена Пьетро Антонио Солари в 1490 году на месте Тимофеевских ворот белокаменного Кремля 1366–1368 годов. Название свое башня получила от располагавшейся неподалеку в Кремле церкви Константина и Елены. Сначала она была проездной и традиционно защищала древние дороги, соединяющие Кремль с Великим посадом (Китай-городом) — подъезды от пристани, от Великой и Варьской улиц. Расположенная близко от реки башня имела мощную отводную стрельницу, соединявшуюся с ней мостом, переброшенным через ров. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Что находится на территории Московского Кремля?", "o": ["Царь-камень", "Царь-колокол", "Царь-бомба", "Царь-звонница"], "a": 1, "e": "С восточной стороны колокольни Ивана Великого на каменном постаменте установлен Царь-колокол, являющийся выдающимся памятником русского литейного искусства XVIII века. Он был отлит по указу императрицы Анны Иоанновны в 1733–1735 годах потомственными московскими литейщиками, колокольных дел мастерами И. Ф. Моториным и его сыном Михаилом. До настоящего времени это самый большой колокол в мире. Его вес почти 202 тонны, высота 6,14 метра, диаметр 6,6 метра. Помимо уникальных размеров, колокол замечателен красотой своей формы и тонко прорисованных скульптурных украшений: барельефных портретов царя Алексея Михайловича и императрицы Анны Иоанновны, а также поясков и картушей с барочным растительным орнаментом с изображениями святых, ангелов и надписями об истории создания колокола. В ноябре 1735 года литье Царь-колокола благополучно завершилось, но по непонятной причине он длительное время оставался в яме, где его и застал страшный пожар, известный под названием Троицкого, возникший в Кремле в мае 1737 года. При тушении огня вода попала на раскаленный металл колокола, неравномерное охлаждение вызвало его растрескивание, при этом от колокола откололся кусок весом 11,5 тонны. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Какой уникальный 200-тонный экспонат Московского Кремля был отлит по приказу императрицы Анны Иоанновны?", "o": ["Царь-колокол", "Князь-колокол", "Император-колокол", "Король-колокол"], "a": 0, "e": "Царь-колокол отлили по приказу Анны Иоанновны в 1730 году, потомственными московскими литейщиками, колокольных дел мастерами И. Ф. Моториным и его сыном Михаилом. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Сколько раз стреляли из Царь-пушки?", "o": ["один", "три", "ни разу", "пять"], "a": 2, "e": "Пушка символизировала военную мощь Русского государства и символически охраняла Покровский собор и Спасские ворота. Пушка была отлита как полноценное боевое орудие, но фактически ни разу не стреляла. Изготовлена по приказу царя Федора Ивановича в 1586 году придворным литейщиком Андреем Чоховым на московском Пушечном дворе. По калибру, который составляет 890 мм, это самая большая пушка в мире, за что она и названа Царь-пушкой. Ее вес приближается к 40 тоннам. Бронзовый ствол пушки украшен литыми фигурными фризами, орнаментальными поясами, памятными надписями и конной фигурой царя Федора Ивановича. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Сколько весит Царь-пушка?", "o": ["20 тонн", "10 кг", "100 кг", "40 тонн"], "a": 3, "e": "Царь-пушка, установленная в настоящее время с западной стороны Ивановской площади, между колокольней Ивана Великого и церковью Двенадцати апостолов, является самым выдающимся произведением русского оружейного мастерства. Она изготовлена по приказу царя Федора Ивановича в 1586 году придворным литейщиком Андреем Чоховым на московском Пушечном дворе. По калибру, который составляет 890 мм, это самая большая пушка в мире, за что она и названа Царь-пушкой. Ее вес приближается к 40 тоннам. Бронзовый ствол пушки украшен литыми фигурными фризами, орнаментальными поясами, памятными надписями и конной фигурой царя Федора Ивановича. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Сколько весит Царь-колокол?", "o": ["200 тонн", "200 кг", "100 кг", "40 кг"], "a": 0, "e": "Это самый большой колокол в мире. Его вес почти 202 тонны, высота 6,14 метра, диаметр 6,6 метра. Был отлит по указу императрицы Анны Иоанновны в 1733–1735 годах потомственными московскими литейщиками, колокольных дел мастерами И. Ф. Моториным и его сыном Михаилом. Помимо уникальных размеров, колокол замечателен красотой своей формы и тонко прорисованных скульптурных украшений: барельефных портретов царя Алексея Михайловича и императрицы Анны Иоановны, а также поясков и картушей с барочным растительным орнаментом с изображениями святых, ангелов и надписями об истории создания колокола. В ноябре 1735 года литье Царь-колокола благополучно завершилось, но по непонятной причине он длительное время оставался в яме, где его и застал страшный пожар, известный под названием Троицкого, возникший в Кремле в мае 1737 года. При тушении огня вода попала на раскаленный металл колокола, неравномерное охлаждение вызвало его растрескивание, при этом от колокола откололся кусок весом 11,5 тонны. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "На какую геометрическую фигуру в плане похож Московский Кремль?", "o": ["параллелограмм", "треугольник", "ромб", "квадрат"], "a": 1, "e": "Московский Кремль похож на неправильный треугольник площадью 27,5 гектара.", "ei": ["kreml/image2.png"]}, {"q": "Какова максимальная высота стен Московского Кремля?", "o": ["3,5 метра", "19 метров", "8 метров", "5 метров"], "a": 1, "e": "Высота стен колеблется от 8 до 19 метров, толщина — от 3,5 до 6,5 метра. Наиболее высокие стены возведены со стороны Красной площади, где не было естественной водной преграды. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Что изображено на фотографии?", "o": ["Оружейная палата", "Кутафья башня", "Сенатская башня", "Потешный дворец"], "a": 0, "e": "Здание Оружейной палаты было построено в 1844–1851 годах на месте разобранного Конюшенного двора XVII века. Оружейная палата предназначалась для хранения и экспонирования сокровищ царской казны и является одним из первых в России зданий специального музейного назначения. (Информация с сайта «Музеи Московского Кремля»).", "qi": ["gon-16.webp"]}, {"q": "Какой всемирно известный музей-сокровищница находится на территории Московского Кремля?", "o": ["Оружейная палата", "Третьяковская галерея", "Эрмитаж", "Русский музей"], "a": 0, "e": "Здание Оружейной палаты, входившее по замыслу его строителя — архитектора К. А. Тона в ансамбль Большого Кремлевского дворца, было построено в 1844–1851 годах на месте разобранного Конюшенного двора ХVII века. Оружейная палата предназначалась для хранения и экспонирования сокровищ царской казны и является одним из первых в России зданий специального музейного назначения. Это здание сменило построенную архитектором И. В. Еготовым в 1806–1812 годах на территории бывшего двора Бориса Годунова старую Оружейную палату, помещения которой были плохо приспособлены для этих целей. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Какая из нижеперечисленных достопримечательностей не находится на территории Московского Кремля?", "o": ["памятник князю Юрию Долгорукому", "Царь-колокол", "Царь-Пушка", "Успенский собор"], "a": 0, "e": "Памятник князю Юрию Долгорукому — основателю Москвы установлен в 1954 году на Советской (ныне Тверской) площади."}, {"q": "Какая называется эта башня Московского Кремля?", "o": ["Спасская", "Сенатская", "Никольская", "Водовзводная"], "a": 0, "e": "Спасская башня была возведена в 1491 году архитектором Пьетро Антонио Солари. Ее строительство положило начало сооружению восточной линии укреплений Кремля. Ворота башни, выходящие на Красную площадь, всегда были главным парадным въездом в Кремль. Также именно на этой башне находятся знаменитые часы — куранты. (Информация с сайта «Музеи Московского Кремля»).", "qi": ["gon-17.webp"]}, {"q": "На скольких башнях Московского Кремля установлены рубиновые пятиконечные звезды?", "o": ["на трех", "на пяти", "на семи:", "на всех"], "a": 1, "e": "Рубиновая пятиконечная звезда находится на Спасской башне, впервые она была установлена в 1935 году, а в 1937 году ее сменила новая, имеющая размах лучей 3,75 метра. Внутри звезды круглосуточно горит лампа мощностью 5000 Вт. Рубиновые звезды на Никольской, Троицкой, Боровицкой и Водовзводной башнях были установлены в 1937 году. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "В каком здании Московского Кремля находится официальный рабочий кабинет Президента России?", "o": ["в Грановитой палате", "в Большом Кремлевском дворце", "в здании Кремлевского Сената", "в Оружейной палате"], "a": 2, "e": "В советское время в здании Сената размещалось Правительство страны. В 1992–1995 годах здание реконструировано под резиденцию Президента Российской Федерации. Исторические интерьеры сохранили только Круглый и Овальный залы, представительские кабинеты резиденции оформлены в стиле интерьеров ХIХ века. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Какое из торжеств каждый год проходит 9 мая на Красной площади?", "o": ["Парад Победы", "фестиваль «Спасская башня»", "принятие присяги военнослужащими Президентского полка", "книжная ярмарка"], "a": 0, "e": "Каждый год 9 мая на Красной площади проходит военный парад в честь Дня Победы над фашистской Германией в Великой Отечественной войне (1941–1945), в которой погибли около 27 миллионов граждан СССР."}, {"q": "В каком соборе Московского Кремля венчали на царство и короновали императоров?", "o": ["в Архангельском соборе", "в Верхоспасском соборе", "в Успенском соборе", "в Благовещенском соборе"], "a": 2, "e": "Успенский собор возведен в 1475–1479 годах итальянским архитектором Аристотелем Фиораванти на месте двух более древних храмов. На протяжении четырех столетий Успенский собор был государственным и культовым центром России: здесь происходило поставление на великое княжение, венчали на царство, короновали императоров. В Успенском соборе возводили в сан епископов, митрополитов и патриархов, оглашали государственные акты, служили молебны перед военными походами и в честь побед. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Какой собор Московского Кремля является храмом-усыпальницей представителей правящих династий — Рюриковичей и Романовых?", "o": ["Архангельский собор", "Успенский собор", "Благовещенский собор", "Верхоспасский собор"], "a": 0, "e": "Архангельский собор возведен в 1505–1508 годах итальянским архитектором Алевизом Новым. Величественное здание главного великокняжеского храма-усыпальницы поражало современников необычностью своего внешнего облика. В 1606 году, после убийства Лжедмития I, желая прервать череду самозванцев, царь Василий Шуйский распорядился торжественно перенести останки царевича Дмитрия, последнего сына Ивана IV, из Углича в Москву и поместить их в Архангельском соборе. Как гласит легенда, вскоре от гроба царевича начали твориться чудеса. После этих событий его мощи были объявлены нетленными, а самого Дмитрия канонизировали как святого мученика. В 1610 году по настоянию народа в Архангельском соборе, в приделе Иоанна Предтечи, похоронили талантливого полководца, победителя «тушинского вора» Лжедмитрия II, князя Михаила Скопина-Шуйского, племянника царя Василия Шуйского. Государи новой династии Романовых с особым вниманием относились к царской усыпальнице. При Михаиле Федоровиче изготовили суконные «кармазинные покровы» на тридцать семь великокняжеских гробниц. В 1628 году была создана великолепная рака покровителю династии Романовых — святому царевичу Димитрию Угличскому. Для надгробий изготовили белокаменные плиты с эпитафиями и резным орнаментом. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Из какого материала соорудили стены Московского Кремля при Дмитрии Донском?", "o": ["из дуба", "из известняка", "из кирпича", "из сосны"], "a": 1, "e": "В 1365 году Кремль жестоко пострадал от очередного пожара. Молодой князь Дмитрий Иванович принял решение возвести каменные укрепления на Боровицком холме. Всю зиму 1367 года из села Мячково, что находилось в 30 верстах от Москвы, возили на санях известняк, а весной начались строительные работы. В результате в центре Москвы поднялись стены и башни, ставшие первой белокаменной крепостью Северо-Восточной Руси. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Какие иностранные зодчие и мастера принимали непосредственное участие в возведении Московского Кремля в середине XV века?", "o": ["французские", "немецкие", "итальянские", "польские"], "a": 2, "e": "По указу Ивана III в Москву для создания достойной «государя всея Руси» резиденции были приглашены не только русские мастера, но и зодчие из Италии, искусство которых высоко ценилось во всех странах Европы. Они возглавили строительные работы. В центре Кремля на основе синтеза русской традиции и художественных принципов итальянской архитектуры эпохи Возрождения был создан ансамбль главной Соборной площади. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "На какой площади находится памятник К. Минину и Д. Пожарскому?", "o": ["на Ивановской площади", "на Красной площади", "на Соборной площади", "на Дворцовой площади"], "a": 1, "e": "Памятник Кузьме Минину (Кузьма Минич Минин) и Дмитрию Пожарскому (Дмитрий Михайлович Пожарский), посвященный предводителям Второго народного ополчения 1612 года, был создан в 1818 году по проекту архитектора Ивана Петровича Мартоса. Изначально установлен на Красной площади перед Верхними торговыми рядами, позднее переименованными в ГУМ. В настоящее время памятник стоит у Покровского собора (он же — Собор Покрова Пресвятой Богородицы, что на Рву; собор Покрова на Рву; собор (храм) Василия Блаженного), куда был перенесен в 1931 году."}, {"q": "Какова площадь Московского Кремля?", "o": ["27,5 га", "14,5 км2", "2670 м2", "1,0 км2"], "a": 0, "e": "Стены и башни Кремля охватили территорию, составляющую 27,5 гектара. Высота стен колеблется от 8 до 19 метров, толщина — от 3,5 до 6,5 метра. Наиболее высокие стены возведены со стороны Красной площади, где не было естественной водной преграды. Всего в крепости 20 башен. Московский Кремль — символ российской государственности, один из крупнейших архитектурных ансамблей мира, богатейшая сокровищница исторических реликвий и памятников культуры. Он расположен на Боровицком холме, на левом берегу Москвы-реки."}, {"q": "Что изображено на фотографии?", "o": ["Теремной дворец", "Потешный дворец", "Большой Кремлевский дворец", "Оружейная палата"], "a": 0, "e": "Теремной дворец — памятник архитектуры XVII века, расположенный на территории Московского Кремля. Дворец был построен в 1635–1636 годах по приказу Михаила Федоровича как парадные царские покои. Возведение первых каменных царских палат велось мастерами Баженом Огурцовым, Антипом Константиновым, Трефилом Шарутиным и Ларионом Ушаковым. В настоящее время Теремной дворец в составе Большого Кремлевского дворца является резиденцией Президента Российской Федерации. (Информация с сайта «Музеи Московского Кремля»)", "qi": ["gon-06.webp"]}, {"q": "Что изображено на фотографии?", "o": ["Грановитая палата", "Благовещенский собор", "Арсенал", "Потешный дворец"], "a": 0, "e": "Грановитая палата была заложена в 1487 году итальянским мастером Марко Фрязином как парадный тронный зал для торжественных приемов в новом великокняжеском дворце Ивана III. Строительство ее закончил в 1491 году ломбардский архитектор Пьетро Антонио Солари. Здание выстроено из кирпича. Название палаты произошло от архитектурного решения главного восточного фасада, выходящего на Соборную площадь. Он облицован белокаменными блоками, каждый из которых отесан на четыре грани. Такая обработка камня, характерная для итальянской архитектуры эпохи Возрождения, называлась «бриллиантовым рустом». В настоящее время Грановитая палата является одним из представительских залов при резиденции Президента Российской Федерации. (Информация с сайта «Музеи Московского Кремля»)", "qi": ["gon-07.webp"]}, {"q": "Что изображено на фотографии?", "o": ["Сенатская башня", "Водовзводная башня", "Оружейная башня", "Спасская башня"], "a": 0, "e": "Сенатская башня выполняла сугубо оборонительные функции — защищала Кремль со стороны Красной площади. С постройкой на территории Кремля в 1787 году М. Ф. Казаковым здания Сената, от которого она получила свое название, а позднее с возведением Мавзолея В. И. Ленина башня стала одним из существенных компонентов ансамбля Красной площади. Высота башни — 34,3 метра. (Информация с сайта «Музеи Московского Кремля»).", "qi": ["gon-08.webp"]}, {"q": "Когда и с какой целью была построена Грановитая палата на территории Московского Кремля?", "o": ["в начале XIV века как спальные палаты", "в конце XII века для хранения запасов зерна", "в конце XV века для проведения торжественных приемов", "в конце XIII — начале XIV века как оружейный склад"], "a": 2, "e": "Грановитая палата была заложена в 1487 году итальянским мастером Марко Фрязином как парадный тронный зал для торжественных приемов в новом великокняжеском дворце Ивана III. Строительство ее закончил в 1491 году ломбардский архитектор Пьетро Антонио Солари. (Информация с сайта «Музеи Московского Кремля»)."}, {"q": "Вдоль западной стены Московского Кремля сейчас расположен Александровский сад, который был основан в 1812 году. Что было на месте этого сада?", "o": ["крепостной ров", "крепостной вал", "река Неглинная", "защитные сооружения из дерева"], "a": 2, "e": "На месте Александровского сада протекала река Неглинная. После Отечественной войны 1812 года по решению императора Александра I ее убрали под землю, заключив в трубу. Ныне Александровский сад — парк площадью 10 гектаров. Он состоит из трех частей: Верхнего, Среднего и Нижнего садов, расположен вдоль западной Кремлевской стены — от площади Революции до Кремлевской набережной. В парке находятся такие исторические объекты, как Кутафья башня Кремля, Итальянский грот, обелиск к 300-летию Дома Романовых и другие. Особое место занимают памятники, посвященные Отечественной войне 1812 года и Великой Отечественной войне, в частности — Могила Неизвестного Солдата — мемориальный архитектурный ансамбль у стен Московского Кремля."}, {"q": "Что изображено на фотографии?", "o": ["Александровский сад", "Петергоф", "Дворцовая площадь", "Ивановская площадь"], "a": 0, "e": "Александровский сад — парк площадью 10 гектаров, состоит из трех частей: Верхнего, Среднего и Нижнего, расположен вдоль западной Кремлевской стены — от площади Революции до Кремлевской набережной. В парке находятся такие исторические объекты, как Кутафья башня Кремля, Итальянский грот, обелиск к 300-летию Дома Романовых и другие. Особое место занимают памятники, посвященные Отечественной войне 1812 года и Великой Отечественной войне, в частности — Могила Неизвестного Солдата — мемориальный архитектурный ансамбль у стен Московского Кремля.", "qi": ["gon-09.webp"]}, {"q": "В каком году XX века Московский Кремль вновь стал резиденцией верховной власти, а также официальным центром политической жизни страны?", "o": ["в 1918 году", "в 1920 году", "в 1919 году", "в 1922 году"], "a": 0, "e": "В 1918 году, после переезда руководства страны из Петрограда в Москву."}, {"q": "Как называется памятник-усыпальница на Красной площади?", "o": ["Покровский собор", "Исторический музей", "Мавзолей", "Оружейная палата"], "a": 2, "e": "Мавзолей Владимира Ильича Ленина — памятник-усыпальница у Кремлевской стены на Красной площади в Москве."}, {"q": "В каком году был возведен первый Мавзолей В. И. Ленина на Красной площади?", "o": ["в 1897 году", "в 1924 году", "в 1939 году", "в 1930 году"], "a": 1, "e": "Первый деревянный Мавзолей на Красной площади был возведен в январе 1924 года."}, {"q": "В каком году на башни Московского Кремля были установлены светящиеся рубиновые звезды?", "o": ["в 1929 году", "в 1937 году", "в 1965 году", "в 1988 году"], "a": 1, "e": "В 1937 году на пяти башнях Кремля были установлены светящиеся рубиновые звезды. Размер их различен — от 3 до 3,75 метра. За два года до этого события, в 1935 году, были сняты четыре орла, находившиеся на Спасской, Никольской, Боровицкой и Троицкой башнях. Пятиконечные звезды были установлены на их место. Шпиль Водовзводной башни до 1937 года венчал позолоченный флажок-флюгер."}, {"q": "В каком году Московский Кремль был внесен в Список всемирного культурного и природного наследия ЮНЕСКО?", "o": ["в 2001 году", "в 1987 году", "в 1990 году", "в 1976 году"], "a": 2, "e": "В декабре 1990 года музейно-архитектурные ансамбли Кремля и Красной площади были включены в Список всемирного культурного и природного наследия ЮНЕСКО как выдающиеся памятники зодчества мирового значения."}, {"q": "В каком году было принято решение о запрете постоянного проживания на территории Московского Кремля?", "o": ["в 1929 году", "в 1955 году", "в 1941 году", "в 1992 году"], "a": 1, "e": "В 1955 году было принято решение о запрете постоянного проживания в Кремле. Настоящий кремлевский долгожитель из состава высшего советского руководства — К. Е. Ворошилов, который прожил в Кремле более 37 лет — с 1925 по 1962 год. Это был последний высокопоставленный житель, выписанный из кремлевской квартиры."}, {"q": "Как назывался Государственный кремлевский дворец до его переименования в 1992 году?", "o": ["Кремлевский дворец съездов", "Дворец культуры и отдыха", "Центральный концертный зал", "Государственная филармония"], "a": 0, "e": "До 1992 года Государственный кремлевский дворец назывался Кремлевским дворцом съездов, использовался для проведения общественно-политических мероприятий и выполнял функции театрально-концертного комплекса."}, {"q": "Когда был построен Государственный кремлевский дворец?", "o": ["в 1938–1940 годах", "в 1959–1961 годах", "в 1973–1976 годах", "в 1981–1984 годах"], "a": 1, "e": "Государственный кремлевский дворец был построен в 1959–1961 годах у Троицких ворот, напротив здания Арсенала по проекту авторского коллектива архитекторов, возглавляемого М. В. Посохиным."}, {"q": "Где на территории Московского Кремля проводится Церемониальный развод конных и пеших караулов Президентского полка ФСО России?", "o": ["на Сенатской площади", "на Соборной площади", "на Троицкой площади", "на Дворцовой площади"], "a": 1, "e": "Церемониальный развод проводится сезонно: в теплое время года (с апреля по октябрь) по субботам в 12.00 на Соборной площади Московского Кремля."}, {"q": "Какое количество экспонатов насчитывает собрание артиллерии музеев Московского Кремля?", "o": ["50 стволов", "150 стволов", "875 стволов", "5000 стволов"], "a": 2, "e": "Музеи Московского Кремля обладают крупнейшим историческим собранием артиллерии в России — 875 стволов."}, {"q": "С какого года Московский Кремль является резиденцией Президента Российской Федерации?", "o": ["с 1985 года", "с 1992 года", "с 2001 года", "с 1976 года"], "a": 1, "e": "В 1992–1995 годах здание Сената реконструировано под резиденцию Президента Российской Федерации. Исторические интерьеры сохранили только Круглый и Овальный залы, представительские кабинеты резиденции оформлены в стиле интерьеров ХIХ века."}, {"q": "Как называется сад, расположенный вдоль западной стены Московского Кремля, где находится Могила Неизвестного Солдата?", "o": ["Тайницкий сад", "Александровский сад", "Петровский сад", "Тушинский сад"], "a": 1, "e": "Александровский сад — парк площадью 10 гектаров, состоит из трех частей: Верхнего, Среднего и Нижнего, и расположен вдоль западной Кремлевской стены — от площади Революции до Кремлевской набережной. В парке находятся такие исторические объекты, как Кутафья башня Кремля, Итальянский грот, обелиск к 300-летию Дома Романовых и другие. Особое место занимают памятники, посвященные Отечественной войне 1812 года и Великой Отечественной войне, в частности — Могила Неизвестного Солдата — мемориальный архитектурный ансамбль у стен Московского Кремля."}, {"q": "Какой художник написал картину «Московский Кремль при Иване III»?", "o": ["А. М. Васнецов", "Ф. С. Рокотов", "И. П. Аргунов", "А. А. Дейнека"], "a": 0, "e": "Картина «Московский Кремль при Иване III» написана Аполлинарием Михайловичем Васнецовым (младшим братом русского художника-живописца Виктора Михайловича Васнецова) в 1921 году."}, {"q": "Какую достопримечательность Московского Кремля создали отец и сын Моторины?", "o": ["Царь-колокол", "Красное крыльцо", "Царь-пушку", "Лобное место"], "a": 0, "e": "Царь-колокол — выдающийся памятник русского литейного искусства XVIII века. Он был отлит по указу императрицы Анны Иоанновны в 1733–1735 годах потомственными московскими литейщиками — колокольных дел мастерами Иваном Федоровичем Моториным и его сыном Михаилом. До настоящего времени это самый большой колокол в мире. Его вес почти 202 тонны, высота 6,14 метра, диаметр 6,6 метра. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "На Красную площадь выходит Набатная башня, на которой висел колокол. Этот колокол возвещал о пожарах в Кремле, в Китай-городе, в Белом городе. Во время чумы 1771 года он созвал в Московский Кремль взбунтовавшийся народ. Что распорядилась сделать с колоколом за эту провинность Екатерина II?", "o": ["удалить язык колокола", "выбросить колокол в реку", "установить колокол в другой башне", "отправить колокол на переплавку"], "a": 0, "e": "В 1771 году Екатерина II приказала удалить язык набатного колокола, звонившего в дни Чумного бунта. Онемевший колокол провисел на башне еще более 30 лет."}, {"q": "В честь чего или кого названы самые торжественные залы Большого Кремлевского дворца Московского Кремля — Андреевский, Александровский и Георгиевский?", "o": ["в честь святых великомучеников", "в честь великих князей", "в честь русских орденов", "в честь архитекторов"], "a": 2, "e": "Андреевский, Александровский и Георгиевский залы Большого Кремлевского дворца Московского Кремля получили названия в честь русских орденов: императорского ордена Святого апостола Андрея Первозванного, императорского ордена Святого Благоверного Князя Александра Невского и императорского Военного ордена Святого Великомученика и Победоносца Георгия."}, {"q": "Какой собор, расположенный на территории Московского Кремля, изображен на фотографии?", "o": ["Благовещенский собор", "Успенский собор", "Архангельский собор", "Верхоспасский собор"], "a": 0, "e": "Благовещенский собор возведен в 1484–1489 годах артелью русских мастеров, приглашенных из Пскова. Благовещенский собор расположен в юго-западном углу Соборной площади, на месте каменной церкви Благовещения XIV века. Собор 1484–1489 годов стал ядром композиции существующего здания. В 1562–1564 годах придел, расположенный на южной галерее, был обновлен. Южное крыльцо, прежде открытое, стало крытым. Над углами галереи возвели четыре одноглавых придела. В те же годы над сводами собора возвели еще две глухие главы. Храм приобрел существующую девятиглавую композицию. Главы и крышу покрыли золоченой медью и собор стали звать «златоверхим». (Информация с сайта «Музеи Московского Кремля»)", "qi": ["gon-10.webp"]}, {"q": "Что изображено на фотографии?", "o": ["Ансамбль колокольни «Иван Великий»", "Успенский собор", "Благовещенский собор", "Архангельский собор"], "a": 0, "e": "Ансамбль колокольни «Иван Великий», расположенный на границе между Соборной и Ивановской площадями, является композиционным центром Московского Кремля. Он создавался на протяжении трех с лишним веков — с 1505 по 1815 год и состоит из трех разновременных объектов: столпа колокольни «Иван Великий», Успенской звонницы и Филаретовой пристройки. (Информация с сайта «Музеи Московского Кремля»)", "qi": ["gon-11.webp"]}, {"q": "Что изображено на фотографии?", "o": ["Успенский собор", "Благовещенский собор", "Архангельский собор", "Церковь Ризположения"], "a": 0, "e": "На фотографии изображен Юго-восточный фасад Успенского собора, возведенного в 1475–1479 годах итальянским архитектором Аристотелем Фиораванти на месте двух более древних храмов. На протяжении четырех столетий Успенский собор был государственным и культовым центром России: здесь происходило поставление на великое княжение, венчали на царство, короновали императоров. В Успенском соборе возводили в сан епископов, митрополитов и патриархов, оглашали государственные акты, служили молебны перед военными походами и в честь побед. (Информация с сайта «Музеи Московского Кремля»)", "qi": ["gon-12.webp"]}, {"q": "Какой собор, расположенный на территории Московского Кремля, изображен на фотографии?", "o": ["Архангельский собор", "Благовещенский собор", "Верхоспасский собор", "церковь Двенадцати апостолов"], "a": 0, "e": "Архангельский собор возведен в 1505–1508 годах итальянским архитектором Алевизом Новым. Величественное здание главного великокняжеского храма-усыпальницы поражало современников необычностью своего внешнего облика. Ренессансное убранство фасадов и интерьера Архангельского собора Кремля оказало значительное воздействие на дальнейшее развитие русской архитектуры, стало общепринятым источником и образцом. (Информация с сайта «Музеи Московского Кремля»)", "qi": ["gon-13.webp"]}, {"q": "Что изображено на фотографии?", "o": ["церковь Ризположения", "Грановитая палата", "Успенский собор", "Благовещенский собор"], "a": 0, "e": "Церковь Ризположения возведена в 1484–1485 годах артелью русских мастеров, приглашенных в Москву из Пскова. До середины XVII века она служила домовым храмом московских митрополитов, а затем патриархов. В 1655 году при патриархе Никоне церковь передана великокняжескому дворцу, в связи с чем ее соединили переходами с хоромами цариц и царевен, а во второй половине XVII века над северной и западной папертями возвели крытые галереи. (Информация с сайта «Музеи Московского Кремля»)", "qi": ["gon-14.webp"]}, {"q": "Какая башня Московского Кремля была построена самой последней?", "o": ["Царская башня", "Тайницкая башня", "Кутафья башня", "Арсенальная башня"], "a": 0, "e": "Последней была построена Царская башня в 1680 году. Ее высота составляет 16,7 метра. Название башни связано с легендой, по которой она служила своеобразной сенью над царским троном, чтобы Государь всея Руси мог со стен Кремля наблюдать за событиями, происходившими на Красной площади. Однако известно, что на башне размещались колокола кремлевской противопожарной службы — так называемого Спасского набата. (Информация взята с сайта «Музеи Московского Кремля»)"}, {"q": "Куда обращена южная стена Московского Кремля?", "o": ["к Александровскому саду", "к Красной площади", "к Москве-реке"], "a": 2, "e": "Южная стена обращена к Москве-реке, северо-западная — к Александровскому саду, восточная — к Красной площади."}, {"q": "Какая башня Московского Кремля самая высокая?", "o": ["Троицкая башня", "Спасская башня", "Угловая Арсенальная башня", "Боровицкая башня"], "a": 0, "e": "Троицкая башня — самая высокая из всех башен Московского Кремля. Высота ее со стороны Александровского сада — 76,35 метра, а вместе со звездой — 80 метров. Троицкая башня — проездная, с отводной стрельницей, — главная на западной стороне Кремля. Ее строительство в 1495–1499 годах архитектором Алевизом Фрязиным завершило возведение укреплений со стороны реки Неглинной, позднее — Александровского сада. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Как называются главные парадные ворота в Московский Кремль?", "o": ["Спасские ворота", "Никольские ворота", "Боровицкие ворота", "Тайницкие ворота"], "a": 0, "e": "Спасские ворота, выходящие на Красную площадь, всегда были главным парадным въездом в Кремль. Они особенно почитались в народе и считались святыми. Ворота служили для выездов государя, торжественных выходов патриарха, встреч иностранных послов. (Информация с официального сайта «Музеи Московского Кремля»)."}, {"q": "Как назывался один из первых достоверных планов Московского Кремля, датированный 1601 годом?", "o": ["Кремленаград", "Кремлевская карта", "Градосхема", "План-схема Кремлеграда"], "a": 0, "e": "Одним из первых планов Московского Кремля, достоверно отображающих его облик на ту эпоху, был план «Кремленаград», датированный 1601 годом. Кремль на плане изображен с высоты птичьего полета, сооружения показаны объемно, что позволяет судить не только об архитектурном облике и материале построек, но и о благоустройстве города в целом — с его дорогами, мостами, рвами, валами и отдельными дворами. (Информация с официального сайта «Музеи Московского Кремля»)"}, {"q": "Когда на территории Московского Кремля был построен Большой Кремлевский дворец (архитектор К. А. Тон)?", "o": ["в 1780-е годы", "в 1840-е годы", "в 1690-е годы", "в 1890-е годы"], "a": 1, "e": "Новый императорский дворец был построен по инициативе императора Николая I в 1838–1849 годах на месте разобранного древнего великокняжеского дворца Ивана III и возведенного на его основании в XVIII веке дворца императрицы Елизаветы Петровны. Проектирование и строительство велись группой архитекторов, которую составляли Н. И. Чичагов, В. А. Бакарев, Ф. Ф. Рихтер, П. А. Герасимов, Ф. Г. Солнцев. Руководил группой К. А. Тон — признанный родоначальник «византийско-русского стиля». Дворцовый комплекс, получивший в дальнейшем название Большой Кремлевский дворец, помимо новопостроенного здания включил в себя часть сохранившихся сооружений конца XV–ХVII веков, входивших ранее в состав древней великокняжеской, а в последствии царской резиденции. Это Грановитая палата, Золотая Царицына палата, Теремной дворец и дворцовые церкви. После постройки в 1851 году Оружейной палаты и примыкающего к ней с севера здания Апартаментов, соединенного воздушным переходом с дворцовым комплексом, образовался единый ансамбль Большого Кремлевского дворца, связанного композиционно и стилистически. (Информация с официального сайта «Музеи Московского Кремля»)."}, {"q": "Когда Оружейная палата Московского Кремля получила статус музея?", "o": ["в начале XX века", "в начале XIX века", "в конце XVIII века", "в конце XIX века"], "a": 1, "e": "Статус музея Мастерская и Оружейная палата получила в соответствии с Указом императора Александра I «О правилах управления и сохранения в порядке и целости в Мастерской и Оружейной палате ценностей» от 10 марта 1806 года. (Информация с официального сайта «Музеи Московского Кремля»)"}, {"q": "Когда проводилась первая научная реставрация Московского Кремля?", "o": ["в конце XIX — начале ХХ века", "в середине XX века", "в середине XIX века", "в конце XVIII века"], "a": 0, "e": "В конце XIX — начале ХХ века в Кремле проводилась первая научная реставрация. Работы были организованы к дню коронации Николая II и продолжились в связи с предстоящим празднованием 300-летия дома Романовых. В этот период фасадам Успенского собора были возвращены древние архитектурные формы, в интерьерах Успенского, Архангельского и Благовещенского соборов раскрывалась и укреплялась древняя живопись, параллельно отрабатывалась научная методика этих работ. (Информация с официального сайта «Музеи Московского Кремля»)"}, {"q": "Где на территории Московского Кремля расположился Гараж Председателя Совнаркома (Гараж В. И. Ленина) после переезда руководства страны из Петрограда в Москву в 1918 году?", "o": ["в Арсенале", "ул. Дворцовая, дом 2", "возле Спасской башни", "ул. Дворцовая, дом 8"], "a": 3, "e": "Гараж Председателя Совнаркома (или Гараж В. И. Ленина) после переезда руководства страны из Петрограда в Москву в 1918 году расположился на Дворцовой улице, дом 8."}, {"q": "Из какого материала был построен первый Мавзолей на Красной площади?", "o": ["из дерева", "из камня", "из кирпича", "из железобетона"], "a": 0, "e": "Первый деревянный Мавзолей возвели на Красной площади в январе 1924 года, второй деревянный — в мае 1924 года. Каменный Мавзолей был построен к октябрю 1930 года."}, {"q": "В каком году Гараж особого назначения получил помещения Автобоевого отряда ВЦИК в корпусе № 9 Московского Кремля?", "o": ["в 1927 году", "в 1932 году", "в 1940 году", "в 1955 году"], "a": 1, "e": "2 июня 1932 года Совет народных комиссаров СССР издал Постановление № 375 «Об особом гараже Кремля». В нем был всего один пункт: «Выделить из автобазы СНК СССР особый гараж Кремля, оставив его в Кремле как самостоятельный гараж Кремля при СНК СССР». Постановление подписал председатель Совета народных комиссаров СССР В. М. Молотов (Скрябин)."}, {"q": "Как был замаскирован Московский Кремль во время Великой Отечественной войны?", "o": ["под городской район", "под склад", "под завод", "под рынок"], "a": 0, "e": "С началом Великой Отечественной войны Московский Кремль был замаскирован под городской район."}, {"q": "Когда Кремль был открыт для экскурсионных показов?", "o": ["в 1937 году", "в 1947 году", "в 1939 году", "в 1955 году"], "a": 3, "e": "В 1955 году Московский Кремль был открыт для массового экскурсионного показа."}, {"q": "В каком здании Московского Кремля хранится экземпляр Конституции Российской Федерации, на котором вступающий в должность Президента России приносит присягу?", "o": ["в Большом Кремлевском дворце", "в здании Кремлевского Сената", "в Оружейной палате", "в Успенском соборе"], "a": 1, "e": "Экземпляр Конституции Российской Федерации, на котором вступающий в должность Президента России приносит присягу, находится в Президентской библиотеке, расположенной в Сенатском дворце Московского Кремля."}, {"q": "План-схема какого музея, расположенного на территории Московского Кремля, изображен на картинке?", "o": ["Оружейной палаты", "Третьяковской галереи", "Успенского собора", "Благовещенского собора"], "a": 0, "e": "Оружейная палата — музей-сокровищница — является частью комплекса Большого Кремлевского дворца. Она размещается в здании, построенном в 1851 году архитектором К. А. Тоном. Основу музейного собрания составили веками хранившиеся в царской казне и патриаршей ризнице драгоценные предметы, выполненные в кремлевских мастерских, а также полученные в дар от посольств иностранных государств. Своим названием музей обязан одному из древнейших кремлевских казнохранилищ. Оружейная палата хранит древние государственные регалии, парадную царскую одежду и коронационное платье, облачения иерархов Русской православной церкви, крупнейшее собрание золотых и серебряных изделий работы русских мастеров, западноевропейское художественное серебро, памятники оружейного мастерства, собрание экипажей, предметы парадного конского убранства. (Информация с официального сайта «Музеи Московского Кремля»)", "qi": ["gon-15.webp"]}, {"q": "Когда были возведены существующие стены и башни Московского Кремля?", "o": ["в 1485–1495 годах", "в 1380–1397 годах", "в 1525-1531 годах", "в 1735-1741 годах"], "a": 0, "e": "Существующие стены и башни Кремля были возведены в 1485–1495 годах. Они пришли на смену белокаменным укреплениям времени Дмитрия Донского и воплотили в себе предшествующий опыт как русских, так и итальянских фортификаторов. Возглавили строительство кремлевских стен и башен Антон Фрязин, Марко Фрязин, Пьетро Антонио Солари и Алевиз Фрязин Старый. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Как прежде называлась Комендантская башня Московского Кремля?", "o": ["Колымажная", "название башни не менялось", "Безымянная", "Дворцовая"], "a": 0, "e": "Комендантская башня называлась прежде Колымажной по располагавшемуся вблизи нее Колымажному двору в Кремле. Башня построена в 1493–1495 годах на северо-западной стороне Кремлевской стены, сегодня протянувшейся вдоль Александровского сада. В 1676–1686 годах была надстроена. В XIX веке башня получила название «Комендантская», когда рядом, в Потешном дворце XVII века, поселился комендант Москвы. Высота башни со стороны Александровского сада — 41,25 метра. (Информация с сайта «Музеи Московского Кремля»)"}, {"q": "Какое из представленных на фотографиях зданий не находится на территории Московского Кремля?", "qi": ["gon-18.webp", "gon-19.webp", "gon-20.webp", "gon-21.webp"], "o": ["№ 1", "№ 2", "№ 3", "№ 4"], "a": 3, "e": "На фотографии под № 4 — Главное здание Московского государственного университета имени М. В. Ломоносова — центральное здание университетского комплекса на Воробьевых (ранее Ленинских) горах.", "t": "pick"}, {"q": "Какой из представленных на фото соборов не находится на территории Кремля?", "qi": ["gon-22.webp", "gon-03.webp", "gon-04.webp", "gon-05.webp"], "o": ["№ 1", "№ 2", "№ 3", "№ 4"], "a": 3, "e": "Собор Непорочного Зачатия Пресвятой Девы Марии находится на улице Малая Грузинская, дом 27/13. Вопросы второго уровня (средней сложности)", "t": "pick"}]}, "lica": {"title": "Первые лица", "qs": [{"q": "Кто является первым и единственным Президентом СССР?", "o": ["Леонид Ильич Брежнев", "Михаил Сергеевич Горбачев", "Юрий Владимирович Андропов", "Борис Николаевич Ельцин"], "a": 1, "e": "ГОРБАЧЕВ Михаил Сергеевич (род. 2 марта 1931 года). Член КПСС с 1952 года. Окончил юридический факультет МГУ имени М. В. Ломоносова в 1955 году. С 1955 года на комсомольской и партийной работе. В 1978–1985 годах — секретарь ЦК КПСС. Член Политбюро ЦК КПСС с 21 октября 1980 по 23 августа 1991 года. В 1985–1991 годах — Генеральный секретарь ЦК КПСС, в 1988–1989 годах — Председатель Президиума Верховного Совета СССР, в 1989–1990 годах — Председатель Верховного Совета СССР, в 1990–1991 годах — Президент СССР. С 1992 года — президент Международного фонда социально-экономических и политологических исследований."}, {"q": "Кто был первым Президентом Российской Федерации?", "o": ["Владимир Владимирович Путин", "Михаил Сергеевич Горбачев", "Борис Николаевич Ельцин", "Дмитрий Анатольевич Медведев"], "a": 2, "e": "ЕЛЬЦИН Борис Николаевич (1 февраля 1931 — 23 апреля 2007 года). Окончил Уральский политехнический институт имени С. М. Кирова в 1955 году. С 1955 года работал в строительных организациях Урала. Член КПСС с 1961 по 1990 год. С 1968 года на партийной работе. В 1985–1986 годах — секретарь ЦК КПСС. Кандидат в члены Политбюро ЦК КПСС с 18 февраля 1986 по 18 февраля 1988 года. В 1985–1987 годах — первый секретарь Московского горкома КПСС, в 1987–1989 годах — первый заместитель председателя Госстроя СССР — министр СССР, в 1990–1991 годах — Председатель Верховного Совета РСФСР, в 1991–1999 годах — Президент РСФСР, Российской Федерации. Похоронен в Москве на Новодевичьем кладбище."}, {"q": "В каком году родился Владимир Ильич Ленин?", "o": ["В 1870 году", "В 1900 году", "В 1780 году", "В 1830 году"], "a": 0, "e": "ЛЕНИН (Ульянов) Владимир Ильич (10(22) апреля 1870 — 21 января 1924). Родился в г. Симбирске. Окончил юридический факультет Санкт- Петербургского университета (экстерном) в 1891 году. Профессиональный революционер, основатель Коммунистической партии Советского Союза. Организатор и вдохновитель Октябрьской революции, создатель Советского государства. Член Политбюро ЦК РКП(б) с 1919 по 1924 год. В 1917–1924 годах — Председатель Совета народных комиссаров РСР/РСФСР, в 1923–1924 годах — Председатель Совета народных комиссаров СССР. Похоронен в Мавзолее на Красной площади в Москве."}, {"q": "Кто изображен на картине?", "o": ["Петр I", "Александр II", "Николай II", "Александр III"], "a": 2, "e": "НИКОЛАЙ II (Романов Николай Александрович) (6 (18) мая 1868 — 17 июля 1918 года). Император Всероссийский. Родился в Царском Селе. Сын императора Александра III и императрицы Марии Федоровны. Получил домашнее образование. В 1894 году вступил на российский престол, коронация состоялась 14 (26) мая 1896 года. В период Первой мировой войны 23 августа (5 сентября) 1915 года вступил в должность Верховного главнокомандующего. 2 (15) марта 1917 года подписал манифест об отречении от престола. С марта 1917 года Николай II с семьей находились под арестом. В Екатеринбурге в ночь с 16 на 17 июля 1918 года все они были расстреляны. Ил.: Картина Г. М. Манизера «Император Николай II с орденом Святого Владимира» (1905). Генрих Матвеевич Манизер (1847–1925). Художественное образование получил в Московском училище живописи, ваяния и зодчества, за ученические работы в котором ему были присуждены малая и большая серебряные медали. Г. М. Манизер — художник широкого диапазона: он писал полотна на библейские сюжеты, портреты, бытовые композиции и батальные сцены.", "qi": ["gon-26.webp"]}, {"q": "В каком году родился император Николай II?", "o": ["В 1886 году", "В 1868 году", "В 1790 году", "В 1800 году"], "a": 1, "e": "НИКОЛАЙ II (Романов Николай Александрович) родился 6 (18) мая 1868 года в Царском Селе. Сын императора Александра III и императрицы Марии Федоровны."}, {"q": "Какой высшее учебное заведение окончил Д. А. Медведев?", "o": ["Ленинградский государственный университет имени А. А. Жданова", "Московский государственный университет имени М. В. Ломоносова", "Новосибирский государственный университет", "Университет дружбы народов имени Патриса Лумумбы"], "a": 0, "e": "МЕДВЕДЕВ Дмитрий Анатольевич (род. 14 сентября 1965 года). Окончил юридический факультет ЛГУ имени А. А. Жданова в 1987 году. В 1999–2000 годах — заместитель руководителя Администрации Президента Российской Федерации, в 2000–2003 годах — первый заместитель руководителя Администрации Президента Российской Федерации. С октября 2003 по ноябрь 2005 года — руководитель Администрации Президента России. В 2005–2008 годах — первый заместитель Председателя Правительства Российской Федерации. В 2008–2012 годах — Президент Российской Федерации. С мая 2012 года по январь 2020 года — Председатель Правительства Российской Федерации. С января 2020 по настоящее время — заместитель Председателя Совета безопасности Российской Федерации"}, {"q": "Кто из российских лидеров подписал Договор между Российской Федерацией и Республикой Крым о принятии в Российскую Федерацию Республики Крым?", "o": ["Б. Н. Ельцин", "Д. А. Медведев", "В. В. Путин", "М. С. Горбачев"], "a": 0, "e": "НИКОЛАЙ II (Романов Николай Александрович) (6 (18) мая 1868 — 17 июля 1918 года). Император Всероссийский. Родился в Царском Селе. Сын императора Александра III и императрицы Марии Федоровны. Получил домашнее образование. В 1894 году вступил на российский престол, коронация состоялась 14 (26) мая 1896 года. В период Первой мировой войны 23 августа (5 сентября) 1915 года вступил в должность Верховного главнокомандующего. 2 (15) марта 1917 года подписал манифест об отречении от престола. С марта 1917 года Николай II с семьей находились под арестом. В Екатеринбурге в ночь с 16 на 17 июля 1918 года все они были расстреляны. ЛЕНИН (Ульянов) Владимир Ильич (10 (22) апреля 1870 — 21 января 1924 года). Родился в г. Симбирске. Окончил юридический факультет Санкт-Петербургского университета (экстерном) в 1891 году. Профессиональный революционер, основатель Коммунистической партии Советского Союза. Организатор и вдохновитель Октябрьской революции, создатель Советского государства. Член Политбюро ЦК РКП(б) с 1919 по 1924 год. В 1917–1924 годах — Председатель Совета народных комиссаров РСР/РСФСР, в 1923–1924 годах — Председатель Совета народных комиссаров СССР. Похоронен в Мавзолее на Красной площади в Москве. ХРУЩЕВ Никита Сергеевич (3 (15) апреля 1894 — 11 сентября 1971 года). Член РКП(б)/ВКП(б)/КПСС с 1918 года. С 1924 года на партийной работе на Украине и в Москве. Член Политбюро (Президиума) ЦК ВКП(б)/ КПСС с 22 марта 1939 по 14 октября 1964 года. В 1949–1953 годах — секретарь ЦК ВКП(б)/ КПСС, в 1953–1964 годах — Первый секретарь ЦК КПСС, в 1958–1964 годах — Председатель Совета министров СССР. С 1964 года на пенсии. Похоронен на Новодевичьем кладбище в Москве. ЕЛЬЦИН Борис Николаевич (1 февраля 1931 — 23 апреля 2007 года). Окончил Уральский политехнический институт имени С. М. Кирова в 1955 году. С 1955 года работал в строительных организациях Урала. Член КПСС с 1961 по 1990 год. С 1968 года на партийной работе. В 1985–1986 годах — секретарь ЦК КПСС. Кандидат в члены Политбюро ЦК КПСС с 18 февраля 1986 по 18 февраля 1988 года. В 1985–1987 годах — первый секретарь Московского горкома КПСС, в 1987–1989 годах — первый заместитель председателя Госстроя СССР — министр СССР, в 1990–1991 годах — Председатель Верховного Совета РСФСР, в 1991–1999 годах — Президент РСФСР, Российской Федерации. Похоронен на Новодевичьем кладбище в Москве."}, {"q": "В каком году Д. А. Медведев вступил в должность Президента Российской Федерации?", "o": ["В 2008 году", "В 2009 году", "В 2003 году", "В 2000 году"], "a": 0, "e": "Д. А. Медведев вступил в должность Президента Российской Федерации 7 мая 2008 года."}, {"q": "В каком году умер И. В. Сталин?", "o": ["В 1939 году", "В 1953 году", "В 1944 году", "В 1976 году"], "a": 1, "e": "И. В. Сталин умер 5 марта 1953 года. 6 марта в Доме союзов началось прощание, которое продлилось три дня. Сотни тысяч простых людей шли попрощаться с вождем. В ночное время на улицах дежурили машины с прожекторами, чтобы освещать путь огромным колоннам народа. 9 марта саркофаг с телом И. В. Сталина было помещен в Мавзолей, рядом с В. И. Лениным. На траурной церемонии на Красной площади присутствовали высшие руководители СССР, представители братских компартий и другие иностранные гости. С этого дня усыпальница стала именоваться Мавзолеем В. И. Ленина и И. В. Сталина. В 1961 году в соответствии с постановлением XXII съезда КПСС тело И. В. Сталина было вынесено из Мавзолея и захоронено у Кремлевской стены. В 1970 году на могиле был установлен бюст."}, {"q": "Кто из перечисленных ниже российских лидеров дал старт первым в истории России зимним Олимпийским играм, проводившимся на ее территории?", "o": ["Б. Н. Ельцин", "Д. А. Медведев", "В. В. Путин", "М. С. Горбачев"], "a": 2, "e": "7 февраля 2014 года Президент Российской Федерации В. В. Путин дал старт XXII зимним Олимпийским играм в Сочи. Для их проведения в городе были построены 11 спортивных объектов общей вместимостью 200 тысяч зрительских мест. Всего в процессе подготовки были возведены 380 сооружений: объекты прибрежного и горного кластеров, транспортная, энергетическая и гостиничная инфраструктура. В Играх в Сочи приняли участие 2876 спортсменов из 88 стран (информация с сайта «http://putin.kremlin.ru/)."}, {"q": "Когда состоялось первое выступление Президента Российской Федерации В. В. Путина в Организации Объединенных Наций (Нью-Йорк)?", "o": ["В 1990 году", "В 1998 году", "В 2000 году", "В 2018 году"], "a": 2, "e": "Президент Российской Федерации В. В. Путин впервые выступил на Саммите тысячелетия — встрече глав государств, проходившей в Штаб-квартире ООН, 6 сентября 2000 года."}, {"q": "Имя какого российского лидера в 2008 году присвоено Уральскому государственному техническому университету?", "o": ["Л. И. Брежнева", "Ю. В. Андропова", "К. У. Черненко", "Б. Н. Ельцина"], "a": 3, "e": "23 апреля 2008 года Уральскому государственному техническому университету присвоено имя Б. Н. Ельцина."}, {"q": "Памяти какого российского или советского главы государства посвящен монумент, установленный осенью 2014 года в столице Сербии Белграде?", "o": ["Монумент посвящен памяти Николая II", "Монумент посвящен памяти В. И. Ленина", "Монумент посвящен памяти Б. Н. Ельцина", "Монумент посвящен памяти Л. И. Брежнева"], "a": 0, "e": "Монумент, посвященный памяти последнего Императора Всероссийского Николая II, был преподнесен в дар Республике Сербия и Белграду. Он стал подарком Российской Федерации, а его установка — частью программы памятных мероприятий к 100-летию начала Первой мировой войны."}, {"q": "Кто из российских или советских лидеров дал старт строительству магистрального газопровода «Сила Сибири» — крупнейшему в мире строительному проекту в этой области?", "o": ["Л. И. Брежнев", "Б. Н. Ельцин", "Д. А. Медведев", "В. В. Путин"], "a": 3, "e": "В сентябре 2014 года Президент Российской Федерации В. В. Путин дал старт строительству газопровода «Сила Сибири». Закачка газа началась в конце октября 2019 года. Магистральный газопровод «Сила Сибири» будет транспортировать газ Иркутского и Якутского центров газодобычи российским потребителям на Дальнем Востоке и в Китай («восточный» маршрут). Протяженность — около 3000 км. Трасса газопровода проходит в экстремальных природно-климатических условиях, преодолевает заболоченные, горные и сейсмоактивные территории, участки с вечномерзлыми и скальными грунтами."}, {"q": "При каком из перечисленных ниже первых лиц и когда столицей государства вновь стала Москва?", "o": ["При Александре III в 1890 году", "При Николае II в 1910 году", "При В. И. Ленине в 1918 году", "При И. В. Сталине в 1926 году"], "a": 2, "e": "В феврале 1918 года состоялось заседание Совета народных комиссаров, на котором В. И. Ленин представил проект постановления об эвакуации правительства в Москву. Соответствующее сообщение было опубликовано в газете «Правда». Все учреждения обязывались переехать в Москву. 12 марта 1918 года Москва вновь стала столицей нашего государства (https://histrf.ru/biblioteka/b/skolko-bylo-stolits-u-rossii)."}, {"q": "Когда состоялся первый ежегодный прямой эфир «Прямая линия с Владимиром Путиным»?", "o": ["В 2001 году", "В 2007 году", "В 2013 году", "В 2015 году"], "a": 0, "e": "«Прямая линия с Владимиром Путиным» — это ежегодная специальная программа, в ходе которой Президент Российской Федерации отвечает на вопросы граждан России, касающиеся общественно-политической и социально-экономической жизни страны, а также международной обстановки. В 2008–2011 годах, когда В. В. Путин являлся премьер-министром России, программа носила название «Разговор с Владимиром Путиным»."}, {"q": "Где родился И. В. Сталин?", "o": ["В г. Симферополь Таврической губернии (совр. Российская Федерация)", "В г. Гори Тифлисской губернии (совр. Грузия)", "В г. Рига Лифляндской губернии (совр. Латвия)", "В г. Кишинев Бессарабской губернии (совр. Молдавия)"], "a": 1, "e": "Иосиф Виссарионович Сталин (Джугашвили) родился (9 (21) декабря 1879 года в городе Гори Тифлисской губернии (современная Грузия)."}, {"q": "О жизни какого советского лидера повествуют книги воспоминаний «Малая земля», «Возрождение», «Целина»?", "o": ["Н. С. Хрущев", "Л. И. Брежнев", "Ю. В. Андропов", "К. У. Черненко"], "a": 1, "e": "«Малая земля», «Возрождение» и «Целина» — мемуары Генерального секретаря ЦК КПСС Л. И. Брежнева, в художественном переложении которых принимали участие советские профессиональные журналисты. За эту трилогию в апреле 1980 года Л. И. Брежневу была присуждена Ленинская премия по литературе."}, {"q": "При каком советском лидере произошел запуск первой в СССР и в мире атомной электрической станции (АЭС)?", "o": ["И. В. Сталин", "Н. С. Хрущев", "Л. И. Брежнев", "К. У. Черненко"], "a": 1, "e": "Энергетический пуск первой в СССР и в мире Обнинской атомной электрической станции (АЭС) произошел 26 июня 1954 года. На следующий день, 27 июня, станция была подключена к энергосистеме страны."}, {"q": "Отрывок из чьей биографии приведен далее: «Родился 2 марта 1931 в Северо-Кавказском крае. Член партии с 1952 года. С 1955 года на комсомольской и партийной работе. В 1978–1985 годах — секретарь ЦК КПСС, в 1985–1991 — Генеральный секретарь ЦК КПСС, в 1988–1989 — Председатель Президиума Верховного Совета СССР, в 1989–1990 — Председатель Верховного Совета СССР, в 1990–1991 — Президент СССР»?", "o": ["К. У. Черненко", "М. С. Горбачев", "Б. Н. Ельцин", "Это вымышленная биография"], "a": 1, "e": "ГОРБАЧЕВ Михаил Сергеевич (род. 2 марта 1931 года). Член КПСС с 1952 года. Окончил юридический факультет МГУ имени М. В. Ломоносова в 1955 году. С 1955 года на комсомольской и партийной работе. В 1978–1985 годах — секретарь ЦК КПСС. Член Политбюро ЦК КПСС с 21 октября 1980 по 23 августа 1991 года. В 1985–1991 годах — Генеральный секретарь ЦК КПСС, в 1988–1989 годах — Председатель Президиума Верховного Совета СССР, в 1989–1990 годах — Председатель Верховного Совета СССР, в 1990–1991 годах — Президент СССР. С 1992 года — президент Международного фонда социально-экономических и политологических исследований."}, {"q": "В каком году умер первый Президент Российской Федерации Б. Н. Ельцин?", "o": ["В 2007 году", "В 2008 году", "В 2009 году", "В 2010 году"], "a": 0, "e": "Б. Н. Ельцин скончался 23 апреля 2007 года. Похоронен на Новодевичьем кладбище в Москве."}, {"q": "Кто был Председателем Государственного Комитета Обороны, наркомом обороны и Верховным главнокомандующим Вооруженными силами СССР во время Великой Отечественной войны?", "o": ["Н. С. Хрущев", "Л. И. Брежнев", "И. В. Сталин", "Эти посты занимали разные государственные деятели"], "a": 2, "e": "8 августа 1941 года, в ходе Великой Отечественной войны, Верховным главнокомандующим Вооруженными силами СССР был назначен И. В. Сталин. Государственный Комитет Обороны (ГКО) был образован 30 июня 1941 года совместным постановлением Президиума Верховного Совета СССР, Совета народных комиссаров СССР и Центрального комитета ВКП(б)."}, {"q": "Кто из советских лидеров открывал Олимпийские игры, прошедшие в Москве в 1980 году?", "o": ["М. С. Горбачев", "К. У. Черненко", "Л. И. Брежнев", "Ю. В. Андропов"], "a": 2, "e": "XXII летние Олимпийские игры проходили в Москве с 19 июля по 3 августа 1980 года. За это время были установлены 36 мировых и 74 олимпийских рекорда. Впервые Олимпийские игры проводились в социалистической стране (https://histrf.ru/lenta-vremeni/event/view/moskovskaia-olimpiada)."}, {"q": "Кому Президент Франции Жак Ширак лично вручил орден Почетного легиона высшей степени?", "o": ["Д. А. Медведеву", "В. В. Путину", "М. С. Горбачеву", "Никому"], "a": 1, "e": "Президент Франции Жак Ширак наградил Президента Российской Федерации В. В. Путина орденом Почетного легиона высшей степени в 2006 году в Елисейском дворце в Париже."}, {"q": "Принимал ли участие Н. С. Хрущев в Гражданской войне?", "o": ["Нет, не участвовал", "Да, он командовал отрядом Красной гвардии", "Война была до рождения Н. С. Хрущева", "Все варианты не верны"], "a": 1, "e": "Н. С. Хрущев участвовал в Гражданской войне. В 1918 году он командовал отрядом Красной гвардии в Рутченково (ныне один из районов г. Донецка), затем был назначен батальонным политкомиссаром на Царицынском фронте. Позже выполнял обязанности инструктора политотдела армии. После окончания войны находился на хозяйственной и партийной работе."}, {"q": "По какой причине В. И. Ленин был сослан на три года в село Шушенское Енисейской губернии?", "o": ["За активное участие в создании петербургского «Союза борьбы за освобождение рабочего класса»", "За издание газеты «Искра»", "За организацию восстания возле Московского Кремля", "За убийство"], "a": 0, "e": "В 1895 году В. И. Ульянов-Ленин принимал активное участие в создании петербургского «Союза борьбы за освобождение рабочего класса». За эту деятельность он был сослан на три года в село Шушенское Енисейской губернии."}, {"q": "В каком высшем учебном заведении учился М. С. Горбачев?", "o": ["В Сельскохозяйственной академии имени К. А. Тимирязева", "В Московском государственном университете имени М. В. Ломоносова", "В Московском государственном институте международных отношений", "В Ленинградском государственном университете имени А. А. Жданова"], "a": 1, "e": "М. С. Горбачев после окончания школы с серебряной медалью без экзаменов поступил в Московский государственный университет имени М. В. Ломоносова."}, {"q": "Какую из перечисленных ниже реформ Д. А. Медведев не проводил, находясь на посту Президента России?", "o": ["Увеличение срока полномочий президента до шести лет", "Учреждение звание Героя Труда Российской Федерации", "Возврат прямых выборов глав регионов", "Расширение границ Москвы"], "a": 1, "e": "Звание Героя Труда Российской Федерации, являющееся высшей степенью отличия за особые трудовые заслуги перед государством и народом, было учреждено 29 мая 2013 года."}, {"q": "Кто из советских лидеров занимал пост руководителя КГБ до того, как стал главой государства?", "o": ["Н. С. Хрущев", "Л. И. Брежнев", "Ю. В. Андропов", "К. У. Черненко"], "a": 2, "e": "Юрий Владимирович Андропов занимал пост председателя Комитета государственной безопасности (КГБ при СМ СССР/КГБ СССР) с 1967 по 1982 год. В ноябре 1982 года Ю. В. Андропов был избран Генеральным секретарем ЦК КПСС, а в июне 1983 года — Председателем Президиума Верховного Совета СССР."}, {"q": "В какие годы Санкт-Петербург носил имя Ленинград в честь первого главы Советского государства В. И. Ленина?", "o": ["с 1945 по 1991 год", "с 1924 по 1991 год", "с 1910 по 1999 год", "с 1953 по 1991 год"], "a": 1, "e": "26 января 1924 года постановлением II Всесоюзного съезда Советов СССР Петроград был переименован в Ленинград. Предложение о переименовании поступило от Петроградского совета рабочих, крестьянских и красноармейских депутатов, поддержанного резолюциями рабочих всех фабрик и заводов Петрограда. 6 сентября 1991 года был издан указ «О возвращении городу Ленинграду его исторического названия Санкт-Петербург». (https://ria.ru/20090126/160108377.html)"}, {"q": "Кто из перечисленных ниже лидеров выступал с речью в ООН?", "o": ["И. В. Сталин", "Н. С. Хрущев", "Л. И. Брежнев", "Ю. В. Черненко"], "a": 1, "e": "Н. С. Хрущев выступал с речью в ООН четыре раза. Помимо Н. С. Хрущева с речью в ООН выступали М. С. Горбачев, Б. Н. Ельцин, Д. А. Медведев, В. В. Путин."}, {"q": "Какой российский президент и когда принял участие в тренировке юных хоккеистов перед финалом турнира «Золотая шайба»?", "o": ["Б. Н. Ельцин", "Д. А. Медведев", "В. В. Путин", "Президенты не принимали участие в тренировке хоккеистов"], "a": 2, "e": "В феврале 2011 года В. В. Путин пообещал участникам универсиады в Турции научиться кататься на коньках. Два месяца он занимался под руководством хоккеиста Алексея Касатонова. К середине апреля он уже уверенно стоял на коньках и 15 апреля 2011 года принял участие в тренировке юных хоккеистов перед финалом турнира «Золотая шайба» (информация с сайта putin.kremlin.ru)."}, {"q": "Кто ввел традицию новогоднего телеобращения?", "o": ["Н. С. Хрущев", "Л. И. Брежнев", "М. С. Горбачев", "Б. Н. Ельцин"], "a": 1, "e": "Леонид Ильич Брежнев положил начало традиции поздравлять граждан с Новым годом. Впервые с телевизионным поздравлением он выступил 31 декабря 1970 года. Данная традиция существует до сих пор, и каждый год руководители Российского государства выступают с обращением к народу в Новогоднюю ночь."}, {"q": "В каком году М. С. Горбачеву вручили Нобелевскую премию мира?", "o": ["В 1990 году", "В 2015 году", "В 1995 году", "В 2000 году"], "a": 0, "e": "В 1990 году М. С. Горбачеву присудили Нобелевскую премию мира «за его ведущую роль в мирном процессе, который сегодня характеризует важную составную часть жизни международного сообщества»."}, {"q": "Кто из перечисленных ниже советских и российских лидеров не выступал в ООН?", "o": ["Н. С. Хрущев", "Л. И. Брежнев", "М. С. Горбачев", "Б. Н. Ельцин"], "a": 1, "e": "Л. И. Брежнев не выступал в ООН. Из перечисленных глав государства Н. С. Хрущев выступал четыре раза, М. С. Горбачев — один раз, Б. Н. Ельцин — два раза."}, {"q": "В каком году ежегодный прямой эфир «Прямая линия с Владимиром Путиным» был самым длинным и составил 4 часа 47 минут?", "o": ["Эфир 2004 года", "Эфир 2013 года", "Эфир 2015 года", "Эфир 2018 года"], "a": 1, "e": "25 апреля 2013 года Президент Российской Федерации В. В. Путин в прямом эфире провел 11-й теледиалог. Глава государства, ответив на 85 вопросов, установил рекорд по продолжительности прямой линии: 4 часа 47 минут."}, {"q": "Какой университет окончил (экстерном) Владимир Ильич Ленин?", "o": ["Санкт-Петербургский университет", "Императорский Варшавский университет", "Московский государственный университет имени М. В. Ломоносова", "В. И. Ленин не окончил университет"], "a": 0, "e": "В 1891 году В. И. Ленин экстерном окончил юридический факультет Санкт-Петербургского университета."}, {"q": "Сколько было лет М. С. Горбачеву, когда он стал кандидатом в члены КПСС?", "o": ["19 лет", "32 года", "15 лет", "25 лет"], "a": 0, "e": "В возрасте 18 лет М. С. Горбачев получил свою первую награду — орден Трудового Красного Знамени. А в 19 лет стал кандидатом в члены КПСС. В 1955 году, после окончания с отличием Московского государственного университета имени М. В. Ломоносова, М. С. Горбачев был направлен на работу в прокуратуру Ставропольского края, но практически сразу переведен на комсомольскую работу. Начинал он с должности заместителя заведующего отделом пропаганды и агитации Ставропольского крайкома ВЛКСМ, а уже в 1961 году стал первым секретарем Ставропольского крайкома ВЛКСМ. С 1962 года М. С. Горбачев на партийной работе. Первоначально он заведовал отделом организационно-партийной работы, а с 1970 года стал первым секретарем Ставропольского крайкома КПСС, проработав в этой должности до 1978 года."}, {"q": "В каком году Н. С. Хрущева освободили от обязанностей Первого секретаря ЦК КПСС, члена Президиума ЦК КПСС и Председателя Совета министров СССР?", "o": ["В 1999 году", "В 1970 году", "В 1964 году", "В 1969 году"], "a": 2, "e": "14 октября 1964 года Пленум ЦК КПСС постановил: «Удовлетворить просьбу т. Хрущева об освобождении его от обязанностей Первого секретаря, члена Президиума ЦК и Председателя Совета Министров СССР в связи с преклонным возрастом и ухудшением состояния здоровья». 15 октября 1964 года Указом Президиума Верховного Совета СССР Н. С. Хрущев был освобожден от обязанностей Председателя Совета министров СССР. В дальнейшем Н. С. Хрущев находился на пенсии вплоть до своей кончины 11 сентября 1971 года."}, {"q": "Кто совершил покушение на В. И. Ленина в 1918 году?", "o": ["Ф. Каплан", "И. Арманд", "К. Маркевич", "Установить не удалось"], "a": 0, "e": "30 августа 1918 года Ф. Каплан совершила покушение на жизнь Председателя СНК РСФСР Владимира Ильича Ленина."}, {"q": "При каком советском лидере и в каком году был осуществлен переход на пятидневную рабочую неделю (пять дней рабочих и два выходных)?", "o": ["При Л. И. Брежневе в 1967 году", "При К. У. Черненко в 1984 году", "При М. С. Горбачеве в 1988 году", "При Н. С. Хрущеве в 1962 году"], "a": 0, "e": "На XXIII съезде КПСС было принято решение о переходе на пятидневную рабочую неделю с двумя выходными дням (суббота и воскресенье). В марте 1967 года рядом указов и постановлений Президиума Верховного Совета СССР и ЦК КПСС в Советском Союзе была введена стандартная «пятидневка» с 8-часовым рабочим днем."}, {"q": "Какой из перечисленных ниже городов изначально именовался Ново-Николаевск в честь императора Николая II?", "o": ["Калининград", "Новосибирск", "Казань", "Нижний Новгород"], "a": 1, "e": "Возникновение города связано с сооружением железнодорожного моста через Обь при строительстве Транссибирской магистрали. На месте современного города на левом берегу Оби располагалось с. Кривощёково (основано в первой половине XVIII века), на правом — небольшие выселки из Кривощёковской волости. Летом 1893 года на правом берегу вместе со строительством моста возникли поселки строителей и заложена железнодорожная станция Обь (в 1909–1926 годах — Николаевск, с 1926 года — Новосибирск-Главный). В 1894 году они объединились в пос. Александровский (в 1898 году переименован в НовоНиколаевский). С 1903–1904 годов заштатный город Новониколаевск Томской губернии стал важным транспортным узлом: пристань на Оби, в 1915 году открыто движение по железнодорожной линии Новониколаевск — Семипалатинск. В 1926 году город получил современное название (по материалам Большой российской энциклопедии, https://bigenc.ru/geography/text/2668227)."}, {"q": "В каком году М. С. Горбачев был избран Президентом СССР?", "o": ["В 1990 году", "В 1985 году", "В 1989 году", "В 1991 году"], "a": 0, "e": "15 марта 1990 года на внеочередном третьем Съезде народных депутатов СССР М. С. Горбачев был избран Президентом СССР — первым и последним в истории Союза Советских Социалистических Республик."}, {"q": "В честь какого советского или российского главы государства названа Президентская библиотека в Санкт-Петербурге?", "o": ["Л. И. Брежнев", "Б. Н. Ельцин", "М. С. Горбачев", "Н. С. Хрущев"], "a": 1, "e": "В мае 2009 года в Санкт-Петербурге была открыта Президентская библиотека имени Б. Н. Ельцина."}, {"q": "При каком советском лидере был введен государственный праздник «День знаний» 1 сентября?", "o": ["При М. С. Горбачеве", "При Л. И. Брежневе", "При Ю. В. Андропове", "При К. У. Черненко"], "a": 3, "e": "1 сентября в 1984 году был официально введен праздник «День знаний». В те годы первым стали проводить Урок мира, который был посвящен воспитанию патриотизма, гордости за Родину и гражданственности."}, {"q": "Кому из советских лидеров в период холодной войны написала письмо американская девочка Саманта Смит, ставшая послом доброй воли?", "o": ["Л. И. Брежневу", "Ю. В. Андропову", "К. У. Черненко", "М. С. Горбачеву"], "a": 1, "e": "В 1982 году десятилетняя Саманта Смит написала письмо Ю. В. Андропову, в котором рассказала о своем огромном беспокойстве из-за возможного начала ядерной войны между СССР и США. 26 апреля 1983 года Саманта получила ответ от Ю. В. Андропова, в котором он подробно рассказал об исключительно мирных намерениях Советского Союза. Переписка американской девочки и Ю. В. Андропова оказалась в центре внимания средств массовой информации СССР и США. В июле 1983 года Саманта Смит по приглашению Ю. В. Андропова посетила Советский Союз: Москву, Ленинград и пионерский лагерь «Артек»https://ru.wikipedia.org/wiki/%D0%A1%D0%BC%D0%B8%D1%82,_%D0%A1%D0%B0%D0%BC%D0%B0%D0%BD%D1%82%D0%B0 - %D0%9F%D0%BE%D0%B5%D0%B7%D0%B4%D0%BA%D0%B0_%D0%B2_%D0%A1%D0%A1%D0%A1%D0%A0, ее путешествие освещалось мировыми СМИ. Через два года, 25 августа 1985 года, Саманта Смит погибла в авиакатастрофе."}, {"t": "match", "q": "Расставьте правильно руководителей государства и место их рождения.", "pairs": [["г. Гори", "И. В. Сталин"], ["Царское Село", "Николай II"], ["г. Симбирск", "В. И. Ленин"], ["г. Ленинград", "Д. А. Медведев"]], "e": ""}, {"t": "match", "q": "Расставьте правильно руководителей государства и годы их жизни.", "pairs": [["1868–1918 годы", "Николай II"], ["1870–1924 годы", "В. И. Ленин"], ["1894–1971 годы", "Н. С. Хрущев"], ["1931–2007 годы", "Б. Н. Ельцин"]], "e": ""}, {"t": "match", "q": "Расставьте правильно руководителей государства и годы их нахождения в статусе первых лиц страны.", "pairs": [["1894–1917 годы", "Николай II"], ["1985–1991 годы", "М. С. Горбачев"], ["1991–1999 годы", "Б. Н. Ельцин"], ["2008–2012 годы", "Д. А. Медведев"]], "e": ""}, {"t": "match", "q": "Расставьте правильно руководителей государства и годы их нахождения в статусе первых лиц страны.", "pairs": [["1924–1953 годы", "И. В. Сталин"], ["1964–1982 годы", "Л. И. Брежнев"], ["1982–1984 годы", "Ю. В. Андропов"], ["1985–1991 годы", "М. С. Горбачев"]], "e": ""}, {"t": "match", "q": "Расставьте правильно советских и российских лидеров и годы их жизни.", "pairs": [["1870–1924 годы", "В. И. Ленин"], ["1906–1982 годы", "Л. И. Брежнев"], ["1911–1985 год
